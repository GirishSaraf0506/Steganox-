version: '3.9'

services:
  steganox:
    image: ghcr.io/${GITHUB_REPOSITORY:-steganox/steganox}:latest
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=production
      - FLASK_DEBUG=0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
